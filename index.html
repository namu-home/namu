<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f2a6b">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NAMU">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>NAMU 주택관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 팀 프로그램(WEHAYO) 머리글 + 흰 제목 영역/파란 지표 패널 + 카드형 표. 넓은 화면은 표, 휴대폰은 카드 */
/* Layout: NAMU(나무) 머리글 + 흰 제목 영역/자두색 지표 패널 + 카드형 표. 넓은 화면은 표, 휴대폰은 카드. 색은 명함의 분홍 하트 나무에서 */
:root{
  --bg:#f7f3f6; --renew-bg:#c9ecd8; --renew-fg:#11593a; --term-bg:#e0434a; --term-fg:#ffffff; --new-bg:#2f6fd6; --new-fg:#ffffff; --new-soft:#e6efff; --surface:#ffffff; --surface2:#fbf7fa; --line:#e9dfe6; --line2:#f3ecf1;
  --fg:#2a1d38; --muted:#74677f; --faint:#9a8fa3;
  --accent:#c4256f; --accent-soft:#fbe7f1; --accent-ink:#a51d5d; --hover:#fbf0f6;
  --panel:#4f2a6b; --panel-ink:#ffffff; --panel-sub:#e6d3f0; --panel-tile:rgba(255,255,255,.1); --panel-edge:rgba(255,255,255,.22);
  --teal:#2e9b6a; --teal-soft:#e3f5ec; --teal-ink:#1f7a51;
  --bad:#c0362c; --bad-soft:#fde9e7; --warn:#8a6420; --warn-soft:#fff4dc;
  --trunk:#7a4a32; --word:#c4256f; --word2:#4f2a6b; --chip-dot:#e8478f; --shadow:rgba(60,20,60,.16);
  --font:"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",sans-serif; --brand:"Fredoka","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150f1b; --renew-bg:#1e5a3d; --renew-fg:#c9f5dc; --term-bg:#c7373d; --term-fg:#ffffff; --new-bg:#3b78e0; --new-fg:#ffffff; --new-soft:#182a4a; --surface:#1f1727; --surface2:#261d30; --line:#3a2d47; --line2:#2d2238;
  --fg:#f1e9f5; --muted:#b2a3bd; --faint:#8d7f99;
  --accent:#f27bb3; --accent-soft:#3d1a30; --accent-ink:#f7a6cc; --hover:#2b1f36;
  --panel:#3a1f52; --panel-ink:#ffffff; --panel-sub:#dcc6ea; --panel-tile:rgba(255,255,255,.08); --panel-edge:rgba(255,255,255,.18);
  --teal:#45c48c; --teal-soft:#16362a; --teal-ink:#7fe0b2;
  --bad:#ff8f86; --bad-soft:#3b1f1f; --warn:#f2c36b; --warn-soft:#382d16;
  --trunk:#c08a68; --word:#f58cbd; --word2:#d9b8ef; --chip-dot:#f27bb3; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150f1b; --renew-bg:#1e5a3d; --renew-fg:#c9f5dc; --term-bg:#c7373d; --term-fg:#ffffff; --new-bg:#3b78e0; --new-fg:#ffffff; --new-soft:#182a4a; --surface:#1f1727; --surface2:#261d30; --line:#3a2d47; --line2:#2d2238;
  --fg:#f1e9f5; --muted:#b2a3bd; --faint:#8d7f99;
  --accent:#f27bb3; --accent-soft:#3d1a30; --accent-ink:#f7a6cc; --hover:#2b1f36;
  --panel:#3a1f52; --panel-ink:#ffffff; --panel-sub:#dcc6ea; --panel-tile:rgba(255,255,255,.08); --panel-edge:rgba(255,255,255,.18);
  --teal:#45c48c; --teal-soft:#16362a; --teal-ink:#7fe0b2;
  --bad:#ff8f86; --bad-soft:#3b1f1f; --warn:#f2c36b; --warn-soft:#382d16;
  --trunk:#c08a68; --word:#f58cbd; --word2:#d9b8ef; --chip-dot:#f27bb3; --shadow:rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;word-break:keep-all;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gut{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* 머리글 */
.hub{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -14px var(--shadow)}
.hub-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 8px 4px 2px;border-radius:12px}
.brand:hover{background:var(--hover)}
.namu-word{font-family:var(--brand);font-weight:700;font-size:24px;letter-spacing:.04em;line-height:1;color:var(--word)}
.namu-word span{color:var(--word2)}
#logo svg{display:block}
.wh-chip{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:2px 11px 2px 9px;white-space:nowrap}
.wh-chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chip-dot);margin-right:6px;vertical-align:1px}
.tabs{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tab .cnt{display:inline-block;margin-left:6px;font-size:11px;background:var(--bad);color:var(--surface);border-radius:999px;padding:0 7px;line-height:18px}
.hub-right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--teal)} .sync.busy i{background:var(--accent)} .sync.err i{background:var(--bad)}
@media (max-width:760px){.hub-in{gap:8px}.tabs{order:3;flex-basis:100%}.hub-right .today{display:none}}

/* 이동 막대 */
.jump{background:var(--surface2);border-bottom:1px solid var(--line)}
.jump-in{display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:4px;flex:1 1 280px;min-width:0;font-size:14px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none;padding:2px 6px;border-radius:7px}
.crumb a:hover{background:var(--hover);color:var(--accent)}
.crumb b{padding:2px 6px}
.crumb .sep{color:var(--faint)}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sel{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px;max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.p:hover{filter:brightness(1.08);color:var(--surface)}
.btn.t{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 본문 */
main{padding-block:20px 60px}
.hero{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 28px -20px var(--shadow)}
.hero-body{position:relative;flex:1 1 300px;min-width:0;padding:18px 22px 16px 30px}
.hero-body::before{content:"";position:absolute;left:0;top:20px;width:5px;height:40px;background:var(--accent);border-radius:0 3px 3px 0}
.eyebrow{margin:0;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
h1{font-size:25px;margin:0 0 2px;font-weight:800;letter-spacing:-.04em;line-height:1.3;text-wrap:balance}
h1 small{font-size:13px;font-weight:700;color:var(--teal-ink);letter-spacing:0;margin-left:6px}
.lead{color:var(--muted);font-size:13px;margin:0}
.hero-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.panel{flex:1 1 520px;min-width:0;background:var(--panel);color:var(--panel-ink);padding:12px 14px}
.panel-t{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--panel-sub);margin:0 4px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{display:block;width:100%;text-align:left;background:var(--panel-tile);border:1px solid var(--panel-edge);border-radius:12px;padding:8px 13px;color:var(--panel-ink)}
button.kpi:hover{background:rgba(255,255,255,.2)}
.kpi .l{display:block;font-size:12px;font-weight:700;color:var(--panel-sub)}
.kpi .n{display:block;font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.5px}
.kpi .n small{font-size:12px;font-weight:400;margin-left:2px;color:var(--panel-sub);letter-spacing:0}
.kpi .s{display:block;font-size:12px;color:var(--panel-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.cmp .kpi .n{font-size:17px}
.kpi.alert{background:var(--surface);border-color:var(--surface)}
.kpi.alert .l,.kpi.alert .n,.kpi.alert .s,.kpi.alert small{color:var(--bad)}
.kpi.warn{background:var(--warn-soft);border-color:var(--warn-soft)}
.kpi.warn .l,.kpi.warn .n,.kpi.warn .s,.kpi.warn small{color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13px;color:var(--fg);white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:1px}
.chip em{font-style:normal;font-weight:400;opacity:.7;margin-left:4px}
.search{height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;width:220px;max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-h h3{flex:1 1 auto;margin:0;font-size:16px;letter-spacing:-.03em}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{padding:30px 10px;text-align:center;color:var(--faint)}

/* 표 */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{text-align:right;padding:7px 8px;border-top:1px solid var(--line2);white-space:nowrap;background:var(--surface)}
.tbl .l{text-align:left}.tbl .c{text-align:center}
.tbl tbody tr.go{cursor:pointer}
.tbl tbody tr.go:hover td{background:var(--hover)}
.tbl tr.grp td{background:var(--surface2);border-top:2px solid var(--line);font-weight:700}
.tbl tr.grp td .gname{font-size:15px;letter-spacing:-.03em}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line);background:var(--surface2)}
.tbl .stick{position:sticky;left:0;z-index:1}
.tbl th.stick{z-index:2}
.tbl .muted{color:var(--faint)}
.tbl td.wrap{white-space:normal;min-width:120px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;line-height:18px}
.tag.ok{background:var(--accent-soft);color:var(--accent-ink)}
.tag.paid{background:var(--teal-soft);color:var(--teal-ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.etc{background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.neg{color:var(--teal-ink)} .pos{color:var(--bad);font-weight:700}

/* 휴대폰 카드 목록 */
.only-wide{display:block}.only-narrow{display:none}
@media (max-width:720px){.only-wide{display:none}.only-narrow{display:block}}
.ugrp{margin-bottom:14px}
.ugrp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px;border:0;background:transparent;width:100%;text-align:left}
.ugrp-h b{font-size:16px;letter-spacing:-.03em}
.ugrp-h span{font-size:12px;color:var(--muted)}
.ucard{display:block;width:100%;text-align:left;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.ucard .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ucard .ho{font-weight:800;font-size:15px}
.ucard .nm{font-weight:700}
.ucard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.ucard .r2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
.ucard .r2 b{color:var(--fg);font-weight:700}

/* 입력 */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.inp{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.r{text-align:right;font-variant-numeric:tabular-nums}
.inp[readonly]{background:var(--surface2);color:var(--muted)}
.fld.wide{grid-column:1/-1}
.cell{width:100%;min-width:76px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 6px;text-align:right;font-variant-numeric:tabular-nums}
.cell.l{text-align:left}
.cell.d{min-width:128px;text-align:left}
.cell.w{min-width:150px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cell[readonly]{pointer-events:none}
.tbl.edit td{padding:3px 4px}
.tbl.edit th{padding:7px 6px}
.tbl tr.cur td{background:var(--accent-soft)}
.tbl tr.due-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.calc{color:var(--muted)}
.im-list{max-height:52vh;overflow:auto;padding:4px 16px 12px}
.im-sec{margin:12px 0 4px;font-size:13px;font-weight:800;color:var(--accent-ink)}
.im-row{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.im-row .k{flex:none;font-size:11px;font-weight:800;border-radius:5px;padding:0 6px;line-height:18px}
.im-row .k.add{background:var(--teal-soft);color:var(--teal-ink)}.im-row .k.chg{background:var(--accent-soft);color:var(--accent-ink)}.im-row .k.del{background:var(--bad-soft);color:var(--bad)}
.im-row .d{color:var(--muted);font-size:12px}
.im-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.im-foot label{margin-right:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.im-warn{margin:10px 16px 0;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),308px));gap:12px;align-items:start}
.usec{border:1px solid var(--line2);border-radius:14px;background:var(--surface2);padding:12px 14px 8px}
.usec h4{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--accent-ink);letter-spacing:.06em}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line2)}
.usec .kv:first-of-type{border-top:0}
.kv label{font-size:13px;font-weight:700;color:var(--muted);text-align:left}
.kv-v{display:flex;align-items:center;gap:6px;min-width:0}
.kv-v .inp{flex:1 1 auto;min-width:0;max-width:170px;height:34px;background:var(--surface)}
.kv-v .suf{flex:none;width:30px;font-size:12px;color:var(--faint);white-space:nowrap;text-align:left}
.kv-wide{margin-top:12px;border-top:0;grid-template-columns:84px minmax(0,1fr)}
.chks{display:flex;flex-direction:column;gap:10px;min-width:0}
.chks .chk{flex:none}
.memo-box{margin-top:12px;max-width:1268px}
.memo-box label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px}
.memo-ta{display:block;width:100%;height:auto;min-height:84px;padding:8px 12px;line-height:1.5;resize:vertical;text-align:left!important;font:inherit}
.kv-wide{max-width:1014px}
.kv-wide .inp{max-width:none}
.chk{flex:1 1 280px;display:flex;flex-direction:column;gap:8px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
label.chk{flex-direction:row;gap:12px;align-items:flex-start}
.chk-row{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.chk-row > span > b{display:block;font-size:14px}
.term-opt{margin-left:0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--term-bg);display:flex;flex-direction:column;gap:6px;cursor:default}
.topt-h{font-size:12px;font-weight:800;color:var(--bad)}
.radio{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.radio input{width:16px;height:16px;accent-color:var(--term-bg)}
.topt-d{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:0;font-size:13px;color:var(--muted)}
.topt-d .inp{width:150px;height:30px}
.topt-n{margin:2px 0 0;font-size:11px;color:var(--faint)}
.chk input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.chk > span > b{display:block;font-size:14px}
.chk small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.chk.on-term{border-color:var(--term-bg);background:var(--bad-soft)}
.chk.on-term input{accent-color:var(--term-bg)}
.chk.on-term .chk-row > span > b{color:var(--bad)}

function ulist(bid){var bo={};blist().forEach(function(b,i){bo[b.id]=i});
  return Object.keys(S.u).map(function(k){return S.u[k]}).filter(function(u){return !bid||u.bid===bid})
   .sort(function(a,b){return (bo[a.bid]-bo[b.bid])||(hoNum(a.ho)-hoNum(b.ho))||String(a.ho).localeCompare(String(b.ho),"ko")||((a.order||0)-(b.order||0))})}
function hoNum(h){var m=String(h||"").match(/\d+/);return m?+m[0]:99999}
function rows(uid){return S.l[uid]||[]}
function rowDue(r){return (+r.rent||0)+(+r.mgmt||0)}
function rowPaid(r){return (+r.rAmt||0)+(+r.mAmt||0)}
function isFuture(r){var d=pd(r.due);return !!(d&&d>TODAY)}
function rowUnpaid(r){if(r.sub)return -rowPaid(r);if(rowDue(r)<=0)return 0;if(isFuture(r))return -rowPaid(r);return rowDue(r)-rowPaid(r)}
function unpaid(u){return (+u.carry||0)+rows(u.id).reduce(function(s,r){return s+rowUnpaid(r)},0)}
/* 최근 청구 상태: 오늘까지 도래한 마지막 차임일 기준 (일 단위) */
function monthState(u){if(!u.name)return {k:"etc",t:"공실"};
  var rs=rows(u.id),li=-1,ni=-1;
  rs.forEach(function(r,i){if(r.sub||!r.due||rowDue(r)<=0)return;var d=pd(r.due);if(!d)return;if(d<=TODAY){if(li<0||r.due>=rs[li].due)li=i}else if(ni<0||r.due<rs[ni].due)ni=i});
  if(li<0)return ni>=0?{k:"ok",t:"청구 예정 "+rs[ni].due.slice(5).replace("-","/")}:{k:"etc",t:"청구 없음"};
  var r=rs[li],due=rowDue(r),paid=rowPaid(r);for(var j=li+1;j<rs.length&&rs[j].sub;j++)paid+=rowPaid(rs[j]);
  var days=Math.round((TODAY-pd(r.due))/864e5),lbl=r.due.slice(5).replace("-","/");
  if(paid>=due)return {k:"paid",t:lbl+" 입금완료"};
  if(unpaid(u)<=0)return {k:"paid",t:lbl+" 선납 차감"};
  if(paid>0)return {k:"warn",t:lbl+" 일부입금"};
  return {k:"bad",t:lbl+" 미입금"+(days?" +"+days+"일":"")}}
function monthly(u){return (+u.rent||0)+(+u.mgmt||0)}
function monthsOf(u,x){var m=monthly(u);if(x<=0||m<=0)return "";var n=x/m;return (Math.abs(n-Math.round(n))<0.05?Math.round(n):n.toFixed(1))+"개월"}
function underLimit(u,x){return x>0&&(+u.limit||0)>0&&x<=(+u.limit)}
function unpaidHtml(u,x){if(!x)return '<span class="muted">0</span>';var under=underLimit(u,x),m=monthsOf(u,x);
  return '<span class="'+(under?"under":x>0?"pos":"neg")+'">'+won(x)+'</span>'+(m?'<span class="mon'+(under?" under":"")+'">'+m+'</span>':'')}
function bname(id){return S.b[id]?S.b[id].name:"(건물 없음)"}
function loanMonthly(bid){return S.loans.filter(function(l){return !bid||l.bid===bid}).reduce(function(s,l){return s+(+l.amount||0)*(+l.rate||0)/12},0)}

try{S.fold=JSON.parse(localStorage.getItem("namu.fold")||"{}")||{}}catch(_){S.fold={}}

/* ---------- 저장 ---------- */
var queue={},busy=0;
function setSync(k,t){var e=$("#sync");e.className="sync "+k;e.lastChild.textContent=t}
function save(path,fn){
  if(!S.db||!S.canWrite){toast("저장 권한이 없어 바뀐 내용이 저장되지 않았습니다.");return}
  busy++;setSync("busy","저장 중");
  queue[path]=(queue[path]||Promise.resolve()).then(fn).then(function(){busy--;if(!busy)setSync("ok","저장됨")},function(e){busy--;
    if(e&&e.code==="unavailable"){return new Promise(function(r){setTimeout(r,600+Math.random()*600)}).then(fn).then(function(){if(!busy)setSync("ok","저장됨")})}
    if(e&&e.code==="invalid_argument"){S.canWrite=false;render()}
    setSync("err","저장 실패");toast("저장하지 못했습니다: "+(e&&e.message||e));});
}
function saveUnit(id,patch){var u=S.u[id];Object.assign(u,patch);save("units/"+id,function(){return S.db.doc("units/"+id).update(patch)})}
function saveLedger(uid){var rs=S.l[uid].slice();save("ledgers/"+uid,function(){return S.db.doc("ledgers/"+uid).set({rows:rs})})}
function saveBld(id,patch){Object.assign(S.b[id],patch);save("buildings/"+id,function(){return S.db.doc("buildings/"+id).update(patch)})}
function saveMarket(bid){var m=JSON.parse(JSON.stringify(S.m[bid]));delete m.id;save("market/"+bid,function(){return S.db.doc("market/"+bid).set(m)})}
function saveLoans(){var rs=S.loans.slice();save("meta/loans",function(){return S.db.doc("meta/loans").set({rows:rs})})}
var tt;function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2600)}

function route(){var h=(location.hash||"").replace(/^#/,"");var m;
  if((m=/^b-(.+)$/.exec(h)))return {v:"b",id:m[1]};
  if((m=/^u-(.+)$/.exec(h)))return {v:"u",id:m[1]};
  if((m=/^l-(.+)$/.exec(h)))return {v:"u",id:m[1],ledger:true};
  if((m=/^m-(.+)$/.exec(h)))return {v:"m",id:m[1]};
  if(h==="market")return {v:"m"};
  if(h==="expiry")return {v:"exp"};
  if(h==="loans")return {v:"loans"};
  return {v:"home"}}
function go(h){if(("#"+h)===location.hash){render(true)}else location.hash=h}

   return {u:u,e:e,pe:pe,soon:!!(e&&e.days<=WARN_DAYS)||!!(pe&&pe.days<=WARN_DAYS),todo:!!(e&&e.days<=WARN_DAYS),sd:pe?pe.days:(e?e.days:9999)}}).filter(function(x){return x.e}).sort(function(a,b){return a.sd-b.sd})}

function payTarget(u){var rs=rows(u.id),li=-1,fi=-1;
  rs.forEach(function(r,i){if(r.sub||!r.due||rowDue(r)<=0)return;var d=pd(r.due);if(!d)return;if(d<=TODAY){if(li<0||r.due>=rs[li].due)li=i}else if(fi<0||r.due<rs[fi].due)fi=i});
  var i=li>=0?li:fi;return i>=0?{i:i,due:rs[i].due}:null}
function addPayment(uid,date,amt){var u=S.u[uid];var rs=S.l[uid]=rows(uid).slice();var t=payTarget(u),msg;
  if(!t){var r0=newRow(u);r0.rDate=date;r0.rAmt=amt;rs.push(r0);msg=r0.due+" 청구 줄을 만들고 기록"}
  else{var r=Object.assign({},rs[t.i]);
    if(!r.rDate&&!(+r.rAmt)&&!(+r.mAmt)){r.rDate=date;r.rAmt=amt;rs[t.i]=r;msg=t.due+" 청구의 입금으로 기록"}
    else{var at=t.i+1;while(at<rs.length&&rs[at].sub)at++;rs.splice(at,0,{sub:true,due:"",rent:0,mgmt:0,rDate:date,rType:"",rAmt:amt,mDate:"",mType:"",mAmt:0,note:"추가 입금"});msg=t.due+" 청구에 추가 입금으로 기록"}}

var IM=null;
function stab(o){if(Array.isArray(o))return "["+o.map(stab).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).filter(function(k){return o[k]!==undefined&&k!=="id"}).sort().map(function(k){return JSON.stringify(k)+":"+stab(o[k])}).join(",")+"}";return JSON.stringify(o)}
function curCols(){var c={buildings:{},units:{},ledgers:{},market:{},meta:{}};
  Object.keys(S.b).forEach(function(k){var d=Object.assign({},S.b[k]);delete d.id;c.buildings[k]=d});
  Object.keys(S.u).forEach(function(k){var d=Object.assign({},S.u[k]);delete d.id;c.units[k]=d});
  Object.keys(S.l).forEach(function(k){c.ledgers[k]={rows:S.l[k]}});
  Object.keys(S.m).forEach(function(k){var d=JSON.parse(JSON.stringify(S.m[k]));delete d.id;c.market[k]=d});

var FL={name:"임차인",phone:"연락처",ho:"호수",type:"방 구조",deposit:"보증금",rent:"월세",mgmt:"관리비",payDay:"차임일",moveIn:"입주일",expiry:"계약 만기",term:"계약기간",carry:"이월 금액",limit:"미납 기준",memo:"비고",autoBill:"자동 청구",terminate:"계약 해지",termExpiry:"해지 종료일",newContract:"새 계약",moveInPlan:"입주 예정일",implied:"묵시적갱신 체크",price:"매매가",loan:"융자",rate:"이율",addr:"소재지",comp:"세대 현황",footer:"하단 문구",rows:"내용"};
function ulabel(id,cols){var u=(cols.units[id])||S.u[id]||{};return bname(u.bid)+" "+(u.ho||id)+(u.name?" "+u.name:"")}
function ledUnpaid(rows,uid,cols){var u=cols.units[uid]||S.u[uid]||{};return (+u.carry||0)+(rows||[]).reduce(function(s,r){return s+rowUnpaid(r)},0)}
function diffCols(f,c){var out=[],cols=["buildings","units","ledgers","market","meta"];
  cols.forEach(function(col){var a=f[col]||{},b=c[col]||{};
    Object.keys(a).forEach(function(id){if(!(id in b))out.push({col:col,id:id,k:"add",data:a[id]});else if(stab(a[id])!==stab(b[id]))out.push({col:col,id:id,k:"chg",data:a[id],old:b[id]})});

function openImport(){var inp=document.createElement("input");inp.type="file";inp.accept=".html,.htm,.json,text/html,application/json";inp.hidden=true;document.body.appendChild(inp);setTimeout(function(){if(inp.isConnected&&!inp.files.length)inp.remove()},600000);

    rd.onload=function(){var txt=String(rd.result||""),m=/<script id="namu-data" type="application\/json">([\s\S]*?)<\/script>/.exec(txt);if(!m&&/^\s*\{/.test(txt))m=[txt,txt];

function nid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newRow(u){var rs=rows(u.id);var last=null;for(var i=rs.length-1;i>=0;i--){if(rs[i].due){last=rs[i].due;break}}
  var due=last?addMonth(last,+u.payDay||0):fd(new Date(TODAY.getFullYear(),TODAY.getMonth(),Math.min(+u.payDay||1,dim(TODAY.getFullYear(),TODAY.getMonth()))));
  return {due:due,rent:+u.rent||0,mgmt:+u.mgmt||0,rDate:"",rType:"",rAmt:0,mDate:"",mType:"",mAmt:0,note:""}}

var armed=null,armT;
document.addEventListener("click",function(e){
  if(e.target.closest("input,select,textarea,label"))return;
  if(e.target.id==="pm"){PM=null;renderPrint();return}
  if(e.target.id==="im"&&IM&&!IM.busy){IM=null;renderImport();return}
  var el=e.target.closest("[data-act],[data-go],[data-filter]");if(!el)return;
  if(e.target.closest("[data-stop]")&&el!==e.target.closest("[data-stop]"))return;
  if(el.hasAttribute("data-confirm")&&armed!==el){if(armed){armed.classList.remove("armed");armed.textContent=armed._t}armed=el;el._t=el.textContent;el.textContent=el.getAttribute("data-confirm");el.classList.add("armed");clearTimeout(armT);armT=setTimeout(function(){if(armed){armed.classList.remove("armed");armed.textContent=armed._t;armed=null}},3000);return}
  armed=null;
  if(el.hasAttribute("data-go")){go(el.getAttribute("data-go"));return}
  if(el.hasAttribute("data-filter")){S.filter=el.getAttribute("data-filter");render();return}
  var act=el.getAttribute("data-act"),uid=el.getAttribute("data-u"),bid=el.getAttribute("data-b"),i=+el.getAttribute("data-i");
  if(act==="fold"){S.fold[bid]=!S.fold[bid];saveFold();render()}
  else if(act==="fold-all"){blist().forEach(function(b){S.fold[b.id]=true});saveFold();render()}
  else if(act==="unfold-all"){S.fold={};saveFold();render()}
  else if(act==="sort"){S.asc=!S.asc;render()}
  else if(act==="filter-unpaid"){S.filter="unpaid";if(route().v!=="home")go("home");else render()}
  else if(act==="exp-soon"){S.showAllExp=false;render()} else if(act==="exp-all"){S.showAllExp=true;render()}
  else if(act==="add-row"){var u=S.u[uid];var rs=S.l[uid]=rows(uid).slice();rs.push(newRow(u));saveLedger(uid);render();toast("청구 줄을 추가했습니다: "+rs[rs.length-1].due)}
  else if(act==="add-pay"){var rs4=S.l[uid]=rows(uid).slice();var at=i+1;while(at<rs4.length&&rs4[at].sub)at++;rs4.splice(at,0,{sub:true,due:"",rent:0,mgmt:0,rDate:fd(TODAY),rType:"",rAmt:0,mDate:"",mType:"",mAmt:0,note:"추가 입금"});saveLedger(uid);render();toast("추가 입금 줄을 넣었습니다. 날짜와 금액을 적어 주세요.")}
  else if(act==="plan-apply"){var up=S.u[uid];saveUnit(uid,{moveIn:up.moveInPlan});render();toast(up.ho+" 입주일을 "+up.moveIn+"로 바꿨습니다.")}
  else if(act==="qpay"){submitQpay(uid)}
  else if(act==="imp-open"){openImport()}
  else if(act==="imp-close"){if(!(IM&&IM.busy)){IM=null;renderImport()}}
  else if(act==="imp-go"){runImport()}
  else if(act==="print"){openPrint(bid,el.getAttribute("data-k"))}
  else if(act==="pm-close"){PM=null;renderPrint()}
  else if(act==="pm-kind"){PM.kind=PM.kind==="mk"?"cur":"mk";renderPrint()}
  else if(act==="pm-pdf"){exportSheet("pdf")}
  else if(act==="pm-png"){exportSheet("png")}
  else if(act==="add-blank"){var rs2=S.l[uid]=rows(uid).slice();rs2.push({due:"",rent:0,mgmt:0,rDate:"",rType:"",rAmt:0,mDate:"",mType:"",mAmt:0,note:""});saveLedger(uid);render()}
  else if(act==="del-row"){var rs3=S.l[uid]=rows(uid).slice();rs3.splice(i,1);saveLedger(uid);render();toast("줄을 삭제했습니다.")}
  else if(act==="bill-month"){var n=0;ulist().forEach(function(u){if(!u.name)return;if(!(+u.rent)&&!(+u.mgmt))return;var rs=rows(u.id);if(rs.some(function(r){return (r.due||"").slice(0,7)===YM}))return;
      var r=newRow(u);if(r.due.slice(0,7)!==YM){r.due=fd(new Date(TODAY.getFullYear(),TODAY.getMonth(),Math.min(+u.payDay||1,dim(TODAY.getFullYear(),TODAY.getMonth()))))}
      S.l[u.id]=rs.concat([r]);saveLedger(u.id);n++});render();toast(n?n+"세대에 이번 달 청구 줄을 만들었습니다.":"모든 세대에 이번 달 청구 줄이 이미 있습니다.")}
  else if(act==="add-bld"){var id=nid("b");var ord=blist().length+1;S.b[id]={id:id,name:"새 건물",addr:"",order:ord,price:0,loan:0,rate:0,land:"",bldg:"",gfa:"",parking:"",comp:"",memo:""};
      var d=Object.assign({},S.b[id]);delete d.id;save("buildings/"+id,function(){return S.db.doc("buildings/"+id).set(d)});go("b-"+id)}
  else if(act==="add-unit"){var us=ulist(bid);var id2=nid(bid+"-u");var o=us.length?(us[us.length-1].order||0)+1:1;
      S.u[id2]={id:id2,bid:bid,ho:"새 호실",order:o,name:"",phone:"",deposit:0,rent:0,mgmt:0,payDay:0,moveIn:"",expiry:"",carry:0,memo:"",type:""};
      var d2=Object.assign({},S.u[id2]);delete d2.id;save("units/"+id2,function(){return S.db.doc("units/"+id2).set(d2)});go("u-"+id2)}
  else if(act==="del-unit"){var u2=S.u[uid];delete S.u[uid];delete S.l[uid];save("units/"+uid,function(){return S.db.doc("units/"+uid).delete().then(function(){return S.db.doc("ledgers/"+uid).delete()})});go("b-"+u2.bid);toast("호실을 삭제했습니다.")}
  else if(act==="mk-add"){ensureMk(bid);S.m[bid].rows.push({floor:"",ho:"",dep:0,rent:0,type:"",note:""});saveMarket(bid);render()}
  else if(act==="mk-del"){ensureMk(bid);S.m[bid].rows.splice(i,1);saveMarket(bid);render()}
  else if(act==="mk-copy"){ensureMk(bid);var b=S.b[bid];S.m[bid].rows=curRows(bid).map(function(r){return {floor:r.floor,ho:r.ho,dep:r.dep,rent:r.rent,type:r.type,note:""}});S.m[bid].price=b.price;S.m[bid].loan=b.loan;S.m[bid].rate=b.rate;saveMarket(bid);render();toast("현재 매물장을 시세표로 복사했습니다.")}
  else if(act==="loan-add"){S.loans=S.loans.concat([{bid:firstBid(),label:"",amount:0,rate:0}]);saveLoans();render()}
  else if(act==="loan-del"){S.loans=S.loans.slice();S.loans.splice(i,1);saveLoans();render()}
});

/* ---------- 자동 청구: 차임일이 되면 다음 청구 줄 추가 ---------- */
var autoRan=false;
function dueRowsFor(u,rs){var last="";rs.forEach(function(r){if(r.due&&r.due>last)last=r.due});if(!last)return [];
  if(Math.round((TODAY-pd(last))/864e5)>92)return [];
  var out=[],nx=addMonth(last,+u.payDay||0),endD=u.terminate?pd(u.termExpiry||u.expiry):null;
  while(pd(nx)<=TODAY&&out.length<4&&(!endD||pd(nx)<endD)){out.push({due:nx,rent:+u.rent||0,mgmt:+u.mgmt||0,rDate:"",rType:"",rAmt:0,mDate:"",mType:"",mAmt:0,note:"자동 청구"});nx=addMonth(nx,+u.payDay||0)}
  return out}
function autoBill(force){
  if(!S.db||!S.canWrite||(autoRan&&!force))return;autoRan=true;
  var todo=ulist().filter(function(u){return u.name&&u.autoBill!==false&&monthly(u)>0&&dueRowsFor(u,rows(u.id)).length});
  if(!todo.length)return;
  var lease=S.db.doc("meta/autobill");
  lease.acquire({holder:"v"+Math.random().toString(36).slice(2),ttlMs:60000}).then(function(res){
    if(!res||!res.acquired)return;
    var n=0;
    return todo.reduce(function(pr,u){return pr.then(function(){
      return S.db.doc("ledgers/"+u.id).get().then(function(snap){
        var rs=snap.exists?((snap.data().rows||[]).slice()):[];var add=dueRowsFor(u,rs);if(!add.length)return;
        rs=rs.concat(add);S.l[u.id]=rs;n+=add.length;busy++;setSync("busy","저장 중");
        return S.db.doc("ledgers/"+u.id).set({rows:rs}).then(function(){busy--;if(!busy)setSync("ok","저장됨")},function(e){busy--;setSync("err","저장 실패")})})})},Promise.resolve())
    .then(function(){if(n){toast("차임일이 된 "+n+"건의 청구 줄을 자동으로 추가했습니다.");sched()}});
  }).catch(function(){});
}
/* ---------- 저장소 연결 ---------- */
function fail(msg){setSync("err","연결 안 됨");$("#view").innerHTML='<div class="splash"><b>저장소에 연결하지 못했습니다</b>'+esc(msg)+'</div>'}
function listen(col,key,fn){S.db.collection(col).onSnapshot(function(snap){fn(snap);S.got[key]=1;if(S.got.u&&S.got.l&&!autoRan)setTimeout(function(){autoBill()},400);setSync(busy?"busy":"ok",busy?"저장 중":"저장됨");sched()},function(e){fail("데이터를 읽는 중 문제가 생겼습니다 ("+(e&&e.code)+"). 페이지를 새로 열어 주세요.")})}
Promise.all([window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null),window.claude&&window.claude.use?window.claude.use("user"):Promise.resolve(null)]).then(function(r){
  var db=r[0],user=r[1];
  if(!db){fail("claude.ai에 로그인한 상태에서 이 페이지를 열면 건물·호실·입금내역이 표시되고 바로 수정할 수 있습니다.");return}
  S.db=db;
  setTimeout(function(){if(S.got.b&&S.got.u)return;var v=$("#view");if(!v||!/splash/.test(v.innerHTML))return;
    v.innerHTML='<div class="splash"><b>데이터가 아직 도착하지 않았습니다</b>저장소에는 연결됐지만 건물 '+(S.got.b?"✓":"…")+' · 호실 '+(S.got.u?"✓":"…")+' · 입금내역 '+(S.got.l?"✓":"…")+' 자료를 기다리는 중입니다. 인터넷 연결을 확인하고 다시 불러와 주세요.<div style="margin-top:12px"><button type="button" class="btn p" onclick="location.reload()">다시 불러오기</button></div></div>'},15000);
  if(user&&user.can){Promise.resolve(user.can("data.write")).then(function(v){if(v===false){S.canWrite=false;sched()}}).catch(function(){})}
  listen("buildings","b",function(s){var o={};s.docs.forEach(function(d){o[d.id]=Object.assign({id:d.id},d.data())});S.b=o});
  listen("units","u",function(s){var o={};s.docs.forEach(function(d){o[d.id]=Object.assign({id:d.id},d.data())});S.u=o});
  listen("ledgers","l",function(s){var o={};s.docs.forEach(function(d){o[d.id]=(d.data().rows||[]).slice()});S.l=o});
  listen("market","m",function(s){var o={};s.docs.forEach(function(d){o[d.id]=JSON.parse(JSON.stringify(d.data()))});S.m=o});
  db.doc("meta/loans").onSnapshot(function(d){S.loans=d.exists?(d.data().rows||[]).slice():[];S.got.loans=1;sched()},function(){});
});
})();
</script>
